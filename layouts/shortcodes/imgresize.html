{{ $src := .Get "src" }}
{{ $width := .Get "width" | default "60%" }}
{{ $alt := .Get "alt" | default "" }}
{{ $caption := .Get "caption" }}

<figure class="centered-image" style="--img-width: {{ $width }};">
  <img src="{{ $src | relURL }}" alt="{{ $alt }}" loading="lazy">
  {{ with $caption }}
    <figcaption>{{ . }}</figcaption>
  {{ end }}
  <figcaption> {{ .Inner }} </figcaption>
</figure>
